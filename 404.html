<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    :root {
      --bg0: #282828;
      --bg1: #3c3836;
      --fg0: #ebdbb2;
      --fg1: #d5c4a1;
      --blue: #458588;
      --purple: #b16286;
      --yellow: #fabd2f;
      --green: #b8bb26;
      --red: #fb4934;
      --shadow-color: #1d2021;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg0);
      color: var(--fg0);
      font-family: 'Fira Mono', 'Fira Code', 'Menlo', 'Consolas', monospace;
      min-height: 100vh;
      min-height: 100svh;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terminal {
      background: var(--bg1);
      border: 3px solid var(--fg1);
      border-radius: 8px;
      box-shadow: 0.8rem 0.8rem 0 var(--shadow-color);
      width: 95vw;
      max-width: 600px;
      min-height: 340px;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .terminal__header {
      background: var(--bg0);
      border-bottom: 2px solid var(--fg1);
      padding: 0.5em 1em;
      display: flex;
      align-items: center;
      gap: 0.5em;
    }

    .terminal__dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot--red {
      background: var(--red);
    }

    .dot--yellow {
      background: var(--yellow);
    }

    .dot--green {
      background: var(--green);
    }

    .terminal__title {
      font-size: 1em;
      color: var(--fg1);
      margin-left: 1em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .terminal__body {
      flex: 1;
      padding: 2em 2em 1.5em 2em;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      font-size: 1.15em;
      line-height: 1.7;
      color: var(--fg0);
      background: repeating-linear-gradient(180deg, transparent 0 23px, rgba(40, 40, 40, 0.08) 23px 24px);
    }

    .terminal__prompt {
      color: var(--green);
      font-weight: bold;
      margin-right: 0.5em;
    }

    .terminal__input {
      color: var(--fg0);
      font-weight: bold;
    }

    .terminal__desc {
      color: var(--fg1);
      margin: 1em 0 2em 0;
      font-size: 1em;
      font-family: inherit;
    }

    .terminal__actions {
      display: flex;
      gap: 1em;
      margin-top: 2em;
    }

    .terminal__btn {
      font-family: 'Fira Mono', 'Menlo', 'Consolas', monospace;
      font-size: 0.95em;
      background: none;
      color: var(--blue);
      border: none;
      border-radius: 0;
      padding: 0;
      font-weight: normal;
      text-transform: none;
      letter-spacing: 0;
      text-decoration: underline;
      cursor: pointer;
      box-shadow: none;
      transition: color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      position: relative;
      outline: none;
      user-select: text;
    }

    .terminal__btn:active,
    .terminal__btn:focus,
    .terminal__btn:hover {
      color: var(--purple);
      background: none;
      border: none;
      text-decoration: underline;
    }

    .terminal__error {
      color: var(--red);
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .terminal {
        max-width: 99vw;
        min-height: 220px;
      }

      .terminal__body {
        padding: 1em 0.5em 1em 0.5em;
        font-size: 1em;
      }

      .terminal__actions {
        flex-direction: column;
        gap: 0.7em;
      }
    }
  </style>
</head>

<body>
  <section class="terminal" style="position:relative;">
    <div class="terminal__header">
      <span class="terminal__dot dot--red"></span>
      <span class="terminal__dot dot--yellow"></span>
      <span class="terminal__dot dot--green"></span>
      <span class="terminal__title">
        <span style="color:var(--green);">ervan</span><span style="color:var(--fg0);">@</span><span
          style="color:var(--blue);">devbox</span><span style="color:var(--fg0);">:~</span>
      </span>
    </div>
    <div class="terminal__body">
      <span><span class="terminal__prompt">$</span><span class="terminal__input">ls -la</span></span>
      <span class="terminal__error">ls: cannot access: No such file or directory</span>
      <span class="terminal__desc">404 - looks like this page doesn't exist :(</span>
      <div class="terminal__actions">
        <a href="/" class="terminal__btn">
          <span>← go back home</span>
        </a>
      </div>
    </div>
  </section>
</body>

</html>
